# BFP accuracy of real Qwen3.8-Flash-Next routed experts. Reads only the sampled experts from the Hugging Face
# checkpoint (HTTP range requests, ~10 MB per expert), then commits results/expert_accuracy.md.
name: accuracy
on:
  workflow_dispatch:
    inputs:
      layers: { description: "layers, e.g. 0,9,19,28,38,47 or 0-47", default: "0,9,19,28,38,47" }
      experts: { description: "random experts per layer", default: "8" }

permissions:
  contents: write

jobs:
  experts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy
      - run: python loader.py accuracy --layers "${{ inputs.layers }}" --experts "${{ inputs.experts }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/expert_accuracy.md
          git diff --cached --quiet && exit 0
          git commit -m "accuracy: real-weight BFP results (layers ${{ inputs.layers }}, ${{ inputs.experts }} experts each)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
