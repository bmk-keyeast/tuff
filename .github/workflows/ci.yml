# Build + correctness tests (ASan/UBSan) + cold-expert CPU benchmark on every push.
# Runner numbers are a sanity check only: a 4-vCPU cloud VM is not the E5-2690 v4 host.
name: ci
on: [push, workflow_dispatch]

jobs:
  test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python plan.py > /dev/null
      - run: make -C kernels test
      - run: make -C kernels bench_bfp
      - name: bench
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)" > bench.txt
          echo "ISA: $(grep -o -w -E 'avx2|fma|avx512f|avx512_vnni' /proc/cpuinfo | sort -u | tr '\n' ' ')" >> bench.txt
          for k in 10 6; do   # 10 = no experts on the card, 6 = uniform routing with ~40% on the card
            for f in bfp4 bfp8; do OMP_NUM_THREADS=$(nproc) ./kernels/bench_bfp $k $f 2048 400 | tee -a bench.txt; done
          done
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
