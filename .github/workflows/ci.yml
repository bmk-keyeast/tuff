# Build + correctness tests (ASan/UBSan) + cold-expert CPU benchmark on every push.
# Runner numbers are a sanity check only: a 4-vCPU cloud VM is not the E5-2690 v4 host.
name: ci
on: [push, workflow_dispatch]

jobs:
  test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the phase-0 kernel is benchmarked as a fixed baseline
      - run: python plan.py > /dev/null
      - run: make -C kernels test
      - name: loader.py packs exactly like bfp_pack
        run: pip install -q numpy && python loader.py selftest kernels/selftest.bin && ./kernels/test_bfp kernels/selftest.bin
      - name: tcache replays the real routing trace like trace.py's simulate_cache
        run: |
          curl -sfLo basalt.prof https://raw.githubusercontent.com/jesdga95/basalt/main/data/profiles/qwen4exp-48x512.prof
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu   # trace.py imports it
          python trace.py cache-check basalt.prof cache.bin && ./kernels/test_cache cache.bin
      - name: tstore maps loader.py's layer files as bfp_pack would pack them
        run: for f in bfp4 bfp8; do python loader.py fake /tmp/store_$f 3 --fmt $f && ./kernels/test_store /tmp/store_$f $f; done
      - run: make -C kernels bench_bfp
      - name: build phase-0 kernel (baseline)
        run: |
          mkdir /tmp/base && git show a5a7b99:kernels/bfp.c > /tmp/base/bfp.c && git show a5a7b99:kernels/bfp.h > /tmp/base/bfp.h
          git show a5a7b99:kernels/bench_bfp.c > /tmp/base/bench_bfp.c
          gcc -O3 -march=haswell -fopenmp /tmp/base/bench_bfp.c /tmp/base/bfp.c -o /tmp/base/bench_bfp -lm
      - name: bench
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)" > bench.txt
          echo "ISA: $(grep -o -w -E 'avx2|fma|avx512f|avx512_vnni' /proc/cpuinfo | sort -u | tr '\n' ' ')" >> bench.txt
          for t in 1 $(nproc); do                # 1 thread = decode speed per core, nproc = memory-bound
            for k in 10 6; do   # 10 = no experts on the card, 6 = uniform routing with ~40% on the card
              for f in bfp4 bfp8; do
                echo "base $(OMP_NUM_THREADS=$t /tmp/base/bench_bfp $k $f 2048 400)" | tee -a bench.txt
                echo "new  $(OMP_NUM_THREADS=$t ./kernels/bench_bfp $k $f 2048 400)" | tee -a bench.txt
              done
            done
          done
          for n in 1 2 3 4; do      # MTP verification: n tokens through the union of their cold experts (~12 for 3 tokens)
            echo "mtp  $(OMP_NUM_THREADS=$(nproc) ./kernels/bench_bfp 12 bfp4 2048 200 $n)" | tee -a bench.txt
          done
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  cuda-build:   # compile only: no GPU on hosted runners
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq make > /dev/null
      - run: make -C kernels test_cuda
